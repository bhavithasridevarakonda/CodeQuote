apiVersion: v1
kind: Service
metadata:
  name: codequote-service
  labels:
    app: codequote
    tier: frontend
spec:
  type: NodePort
  selector:
    app: codequote
  ports:
  - name: http
    port: 80         # Port exposed internally inside the Kubernetes cluster
    targetPort: 80   # Port on the container running Nginx
    nodePort: 30080  # Port accessible externally across Kubernetes worker node IP
